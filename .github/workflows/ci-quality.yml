# Author: Domonick Mack
# Date: 2026-11-10
# Description: GitHub Actions CI pipeline for code quality, static analysis, formatting, and header verification.

name: "Stage 1 - Code Quality & Static Analysis"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-and-completeness-check:
    name: "File Header & Code Standards Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Author/Date/Description headers and zero TODOs
        run: python3 scripts/verify_headers.py

  flutter-static-analysis:
    name: "Flutter Format & Analyzer (mac_notes_app)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac_notes_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter static analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

  backend-static-analysis:
    name: "Django & Python Linting (backend)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.0

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Django system check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-static-analysis-secret-key-with-sufficient-entropy-for-validation-check"
        run: python manage.py check

  infrastructure-lint:
    name: "Dockerfile, Shell Script & Compose Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on build & automation scripts
        run: |
          shellcheck mac_notes_app/scripts/*.sh

      - name: Lint backend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml

      - name: Validate docker-compose.yml schema
        run: docker compose config -q
