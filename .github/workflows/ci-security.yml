# Author: Domonick Mack
# Date: 2026-11-10
# Description: GitHub Actions security & dependency auditing pipeline (Gitleaks, pip-audit, Dart OSV/outdated, and Trivy container scan).

name: "Stage 3 - Security & Dependency Auditing"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: stage3-security-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scanning:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  python-dependency-audit:
    name: "Python Dependency Vulnerability Audit (pip-audit)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit and scan requirements.txt
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc on

  flutter-dependency-audit:
    name: "Flutter / Dart Dependency Security Audit (OSV & pub outdated)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Check Flutter dependency resolution & outdated packages
        working-directory: mac_notes_app
        run: |
          flutter pub get
          dart pub outdated --json > pub_outdated_report.json

      - name: Upload Dart dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-pub-outdated-report
          path: mac_notes_app/pub_outdated_report.json
          retention-days: 14

      - name: Scan pubspec.lock with Google OSV-Scanner
        uses: docker://ghcr.io/google/osv-scanner:latest
        with:
          args: --lockfile=mac_notes_app/pubspec.lock

  container-image-trivy-scan:
    name: "Docker Image Vulnerability Scan (Trivy)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image for scanning
        run: |
          docker build -t lusid-backend:ci-scan -f backend/Dockerfile backend

      - name: Run Trivy vulnerability scanner on backend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 0 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            lusid-backend:ci-scan
